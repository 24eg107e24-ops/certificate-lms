<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Certificate Management LMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="logo">🎓 CertLMS</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="verify.html">Verify Certificate</a></li>
            </ul>
            <div class="auth-buttons">
                <a href="login.html" class="btn btn-secondary">Login</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="form-card">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">Create an Account</h2>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Join the platform to access courses, exams, and verified certificates.
            </p>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="e.g. K. Deekshitha" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a strong password" required>
                </div>
                <div class="form-group">
                    <label for="role">Register As</label>
                    <select id="role" class="form-control" required>
                        <option value="STUDENT" selected>Student</option>
                        <option value="INSTRUCTOR">Instructor / Faculty</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Complete Registration
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign in here</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Certificate Management LMS | <strong>K.Deekshitha (24EG107E24) AIML-E</strong></p>
    </footer>

    <script src="js/api.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;

            try {
                const response = await AuthAPI.register(name, email, password, role);
                Auth.setUser(response);
                showToast("Account created successfully! Redirecting...", "success");
                setTimeout(() => {
                    Auth.redirectByRole(response.role);
                }, 1000);
            } catch (err) {
                showToast(err.message || "Failed to register.", "error");
            }
        }
    </script>
</body>
</html>
