# Server Settings (Supports dynamic cloud PORT like Render/Railway, defaults to 8080)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=certsystem

# Database Configuration (Accepts Cloud Env Vars or defaults to local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cert_lms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (useful for local development/debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
